<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindClash: Player Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #05070d;
      --card-bg: rgba(14, 20, 36, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --success: #10b981;
      --danger: #f43f5e;
      --glow-cyan: rgba(56, 189, 248, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before, body::after {
      content: ""; position: fixed; width: 540px; height: 540px; border-radius: 50%;
      filter: blur(150px); pointer-events: none; z-index: -1;
    }
    body::before { top: -140px; left: -100px; background: radial-gradient(circle, rgba(56, 189, 248, 0.18), transparent 70%); }
    body::after { bottom: -140px; right: -100px; background: radial-gradient(circle, rgba(192, 132, 252, 0.16), transparent 70%); }

    header {
      max-width: 1000px;
      margin: 0 auto 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      background: rgba(14, 20, 36, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 25px 50px -18px rgba(0, 0, 0, 0.7);
    }

    .brand-title {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pulse-dot { width: 14px; height: 14px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 16px #38bdf8; }
    .container { max-width: 1000px; margin: 0 auto; display: grid; gap: 28px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.55);
    }

    .card h3 { font-size: 17px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    label { font-size: 13px; font-weight: 600; color: var(--text-dim); }

    input {
      background: rgba(8, 12, 22, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    .fixed-multiplier-badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
    }

    button {
      background: var(--accent-gradient);
      color: #040814;
      font-weight: 700;
      cursor: pointer;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    button:hover { transform: translateY(-2px); }
    button.btn-danger { background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }

    .points-display {
      font-size: 42px;
      font-weight: 800;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin: 16px 0;
    }

    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
    th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); }
    td { padding: 14px 16px; font-size: 14px; background: rgba(9, 14, 26, 0.55); border-top: 1px solid rgba(255, 255, 255, 0.04); border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
    td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
    td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }

    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-won { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-lost { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 class="brand-title"><span class="pulse-dot"></span> MindClash Player Arena</h1>
      <p style="color: var(--text-dim); font-size: 14px; margin-top: 4px;">Place Action • Wait for Admin Call</p>
    </div>
  </header>

  <main class="container">
    <!-- AUTHENTICATION FORM (LOGIN ONLY) -->
    <div id="authSection" class="card" style="max-width: 440px; margin: 40px auto; width: 100%;">
      <h3>Sign In with Mobile</h3>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="userMobileInput" placeholder="Enter your registered mobile number">
      </div>
      <button onclick="handleLogin()" style="width: 100%; margin-top: 6px;">Login to Arena</button>
    </div>

    <!-- ARENA GAME DASHBOARD -->
    <div id="dashboardSection" style="display: none; grid-gap: 28px;">
      <div class="grid-2">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin-bottom: 0;">Account Overview</h3>
            <button class="btn-danger" onclick="logout()" style="padding: 6px 12px; font-size: 12px;">Sign Out</button>
          </div>
          <div style="color: var(--text-dim); font-size: 14px;">
            Player: <strong id="currentUsername" style="color: var(--text); font-weight: 700;">-</strong>
          </div>
          <div style="color: var(--text-dim); font-size: 13px; margin-top: 4px;">
            Mobile: <strong id="currentUserMobile" style="color: var(--accent); font-family: 'JetBrains Mono';">-</strong>
          </div>
          <label style="display: block; margin-top: 20px;">Current Balance</label>
          <div class="points-display" id="currentUserPoints">0 pts</div>
        </div>

        <div class="card">
          <h3>Commit Action to Queue</h3>
          <div class="form-group">
            <label>Points to Commit</label>
            <input type="number" id="betAmount" placeholder="e.g. 250" min="1">
          </div>
          <div class="form-group">
            <label>Target Multiplier</label>
            <div class="fixed-multiplier-badge">
              <span>Bet (2x Multiplier)</span>
              <span style="font-size: 12px; color: var(--text-dim);">Fixed</span>
            </div>
          </div>
          <button onclick="submitAction()" style="width: 100%; margin-top: 6px;">Submit Action</button>
        </div>
      </div>

      <div class="card">
        <h3>Your Action Log</h3>
        <div style="overflow-x: auto; max-height: 380px;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Committed Stake</th>
                <th>Multiplier Choice</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="userBetsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Configured with your Firebase URL
    const firebaseConfig = {
      databaseURL: "https://mindclash-85090-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let bets = [];

    // Auto-login from device memory
    const savedMobile = localStorage.getItem("arena_active_mobile");
    if (savedMobile) {
      attachUserListener(savedMobile);
    }

    function handleLogin() {
      const mobile = document.getElementById("userMobileInput").value.trim();
      if (!mobile) {
        alert("Please enter your mobile number.");
        return;
      }

      db.ref("arena_users/" + mobile).once("value", (snapshot) => {
        const user = snapshot.val();
        if (!user) {
          alert("Mobile number not registered. Please ask Admin to enlist you.");
          return;
        }

        localStorage.setItem("arena_active_mobile", mobile);
        document.getElementById("userMobileInput").value = "";
        attachUserListener(mobile);
      });
    }

    function attachUserListener(mobile) {
      // Live listener for real-time score updates
      db.ref("arena_users/" + mobile).on("value", (snapshot) => {
        currentUser = snapshot.val();
        render();
      });

      // Live listener for bets placed by this user
      db.ref("arena_bets").on("value", (snapshot) => {
        const allBets = snapshot.val() ? Object.values(snapshot.val()) : [];
        bets = allBets.filter(b => b.userMobile === mobile);
        bets.sort((a, b) => b.id - a.id);
        render();
      });
    }

    function logout() {
      if (currentUser && currentUser.mobile) {
        db.ref("arena_users/" + currentUser.mobile).off();
      }
      currentUser = null;
      localStorage.removeItem("arena_active_mobile");
      render();
    }

    function submitAction() {
      const amountInput = document.getElementById("betAmount");
      const amount = parseInt(amountInput.value);

      if (isNaN(amount) || amount <= 0) {
        alert("Enter a valid points amount.");
        return;
      }

      if (!currentUser) return;

      if ((currentUser.points || 0) < amount) {
        alert("Insufficient balance to commit this stake.");
        return;
      }

      const betId = Date.now();

      // Deduct balance directly in Firebase
      db.ref("arena_users/" + currentUser.mobile + "/points").transaction((pts) => {
        return (pts || 0) - amount;
      });

      // Submit bet directly to Firebase queue (Admin sees it instantly with timestamp)
      db.ref("arena_bets/" + betId).set({
        id: betId,
        userId: currentUser.id,
        userName: currentUser.username,
        userMobile: currentUser.mobile,
        amount: amount,
        choice: "Bet (2x)",
        status: "pending"
      });

      amountInput.value = "";
    }

    function render() {
      const authBox = document.getElementById("authSection");
      const dashBox = document.getElementById("dashboardSection");

      if (!currentUser) {
        authBox.style.display = "block";
        dashBox.style.display = "none";
        return;
      }

      authBox.style.display = "none";
      dashBox.style.display = "grid";

      document.getElementById("currentUsername").innerText = currentUser.username;
      document.getElementById("currentUserMobile").innerText = currentUser.mobile;
      document.getElementById("currentUserPoints").innerText = `${(currentUser.points || 0).toLocaleString()} pts`;

      const betsTable = document.getElementById("userBetsTable");

      if (bets.length === 0) {
        betsTable.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-dim); padding: 24px;">No actions submitted yet.</td></tr>`;
      } else {
        betsTable.innerHTML = bets.map(b => {
          let badgeClass = 'status-pending';
          if (b.status === 'won') badgeClass = 'status-won';
          if (b.status === 'lost') badgeClass = 'status-lost';

          return `
            <tr>
              <td style="font-family: 'JetBrains Mono';">#${b.id.toString().slice(-4)}</td>
              <td style="font-family: 'JetBrains Mono'; font-weight: 700; color: var(--accent);">${b.amount.toLocaleString()} pts</td>
              <td><strong>${b.choice}</strong></td>
              <td><span class="status-badge ${badgeClass}">${b.status}</span></td>
            </tr>
          `;
        }).join("");
      }
    }
  </script>
</body>
</html>
